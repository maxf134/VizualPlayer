<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÜberViz GLSL Pro — Audio Visualizer</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
    <!-- Three.js и модули пост-обработки -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <!-- Панель управления dat.gui -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>
    <div id="ui-container">
        <div class="header-row">
            <h1>ÜberViz GLSL Pro</h1>
            <button id="btn-zen-inline" class="btn-zen-small" title="Скрыть интерфейс и развернуть на весь экран (F)">⛶ На весь экран</button>
        </div>

        <!-- Индикатор активного источника звука и авто-BPM -->
        <div id="source-status" class="source-status">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Источник: Плейлист (Ожидание)</span>
        </div>
        
        <div class="controls-row">
            <label for="audiofile" class="btn-upload">📁 Добавить треки</label>
            <input type="file" id="audiofile" accept="audio/*" multiple style="display: none;">
            
            <div class="live-buttons-row">
                <button id="btn-mic" class="btn-live" title="Визуализация с микрофона или Стерео микшера">🎤 Микрофон</button>
                <button id="btn-sys-audio" class="btn-live" title="Захват системного звука ПК (Яндекс Музыка, плееры, вкладки)">🖥️ Звук ПК</button>
            </div>

            <select id="mic-select" class="device-select" style="display: none;" title="Выберите микрофон или Стерео микшер"></select>
        </div>

        <div class="seek-container">
            <input type="range" id="seek-bar" value="0" min="0" max="100" step="0.1">
            <div class="time-info">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="player-controls">
            <button id="btn-prev" title="Предыдущий трек">⏮</button>
            <button id="btn-play" title="Плей / Пауза">▶</button>
            <button id="btn-stop" title="Стоп">⏹</button>
            <button id="btn-next" title="Следующий трек">⏭</button>
        </div>

        <div class="volume-container">
            <span>🔊</span>
            <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1">
        </div>

        <audio id="audio"></audio>

        <div id="playlist-container">
            <h3>Плейлист (<span id="track-count">0</span>)</h3>
            <p class="hint">Двойной клик — трек • F/Q — полный экран • S — тряска</p>
            <ul id="playlist"></ul>
        </div>
    </div>

    <button id="btn-zen-floating" title="Переключить полноэкранный режим и скрыть интерфейс (F)">
        ⛶ Полный экран (Скрыть UI)
    </button>

    <!-- Модульная архитектура со сбросом кэша GitHub Pages -->
    <script src="config.js?v=2"></script>
    <script src="shaders.js?v=2"></script>
    <script src="layers3d.js?v=2"></script>
    <script src="audio.js?v=2"></script>
    <script src="app.js?v=2"></script>
</body>
</html>
